<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapbox Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <script>
        console.log('=== SIMPLE MAP TEST ===');
        console.log('1. Mapbox loaded:', typeof mapboxgl !== 'undefined');
        
        // Set your token
        mapboxgl.accessToken = 'pk.eyJ1IjoiamluZ2xlYmFsc2giLCJhIjoiY21sNm1yY2U3MDJkMDNmcjBneG5hN2RzbSJ9.S5GEGRibVdFnLfdzZIusHw';
        console.log('2. Token set');
        
        // Create map
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-1.5358, 52.2919], // Leamington Spa
            zoom: 13
        });
        
        console.log('3. Map created');
        
        map.on('load', () => {
            console.log('4. ✅ MAP LOADED SUCCESSFULLY!');
            alert('Map loaded! If you see this, the token works.');
        });
        
        map.on('error', (e) => {
            console.error('5. ❌ MAP ERROR:', e);
            alert('Map error: ' + JSON.stringify(e.error));
        });
    </script>
</body>
</html>
